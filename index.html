<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>圣诞树 - 冰雪星海流沙底座版</title>
<style>
  html,body{margin:0;height:100%;background:#01040a;overflow:hidden}
  canvas{display:block; cursor: crosshair;}
  
  .text-container {
  position: absolute;
  left: 6%;
  top: 45%;
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  max-width: 88vw;
}

#typing-text {
  font-family: 'Arial Black', 'Microsoft YaHei', sans-serif;
  font-size: clamp(18px, 6vmin, 42px);   /* 关键：随视口自适应 */
  line-height: 1.25;
  color: #fff;
  text-shadow: 0 0 10px #a0e0ff, 0 0 20px #40a0ff, 0 0 30px #0066cc;
  letter-spacing: 2px;
  min-height: 1.3em;                     /* 由 60px 改为相对单位 */
  white-space: pre-wrap;
  word-break: break-word;                /* 长单词自动换行，防溢出 */
}

.cursor {
  display: inline-block;
  width: 0.09em;                         /* 由 4px 改为相对字号 */
  height: 1em;
  background-color: #a0e0ff;
  margin-left: 0.1em;
  box-shadow: 0 0 10px #40a0ff;
  animation: blink 0.8s infinite;
  vertical-align: -0.15em;
}

/* 手机 / 窄屏：文字移到顶部居中，避免和圣诞树重叠 */
@media (max-width: 640px), (max-height: 480px) {
  .text-container {
    left: 50%;
    top: 5%;
    transform: translateX(-50%);
    align-items: center;
    width: 92vw;
    max-width: 92vw;
  }
  #typing-text {
    font-size: clamp(16px, 6.5vmin, 26px);
    letter-spacing: 1px;
    text-align: center;
  }
}

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="text-container">
    <div id="typing-text"></div>
  </div>
  
  <canvas id="c"></canvas>

<script>
const CONFIG = {
  title: "圣诞快乐\nMerry Christmas\n愿冰雪伴你前行" 
};

function startTyping() {
  const textEl = document.getElementById('typing-text');
  const text = CONFIG.title;
  let index = 0;
  
  function type() {
    if (index < text.length) {
      const char = text.charAt(index);
      if (char === '\n') textEl.innerHTML += '<br>';
      else textEl.innerHTML += char;
      index++;
      setTimeout(type, 120 + Math.random() * 80); 
    } else {
      textEl.innerHTML += '<span class="cursor"></span>';
    }
  }
  textEl.innerHTML = ''; 
  setTimeout(type, 500); 
}

(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= 1. 预渲染晶莹剔透的雪花晶体 ================= */
  const SPR = 64;
  const snowCrystalSprites = [];
  
  for (let i = 0; i < 3; i++) {
    const c = document.createElement('canvas');
    c.width = c.height = SPR;
    const g = c.getContext('2d');
    g.translate(SPR/2, SPR/2);
    g.rotate(i * Math.PI / 6); 

    const glow = g.createRadialGradient(0, 0, 0, 0, 0, SPR/2);
    glow.addColorStop(0, 'rgba(220, 245, 255, 0.6)');
    glow.addColorStop(0.5, 'rgba(120, 200, 255, 0.25)');
    glow.addColorStop(1, 'rgba(0, 100, 255, 0)');
    g.fillStyle = glow;
    g.beginPath(); g.arc(0, 0, SPR/2, 0, Math.PI*2); g.fill();

    g.strokeStyle = 'rgba(255, 255, 255, 1)';
    g.lineWidth = 2.5; 
    g.lineCap = 'round';
    
    for (let j = 0; j < 6; j++) {
      g.rotate(Math.PI / 3);
      g.beginPath();
      g.moveTo(0, 0); g.lineTo(0, -22);
      g.moveTo(0, -10); g.lineTo(-7, -17);
      g.moveTo(0, -10); g.lineTo(7, -17);
      g.moveTo(0, -18); g.lineTo(-4, -22);
      g.moveTo(0, -18); g.lineTo(4, -22);
      g.stroke();
    }

    const core = g.createRadialGradient(0, 0, 0, 0, 0, 7);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(0.5, 'rgba(200, 240, 255, 1)');
    core.addColorStop(1, 'rgba(100, 200, 255, 0)');
    g.fillStyle = core;
    g.beginPath(); g.arc(0, 0, 7, 0, Math.PI*2); g.fill();

    snowCrystalSprites.push(c);
  }
  
  const spriteOf = () => snowCrystalSprites[Math.floor(Math.random() * snowCrystalSprites.length)];

  /* ================= 2. 树体粒子构建 ================= */
  const TREE_H = 550, BASE_R = 230, TURNS = 32, LAYERS = 4; 
  const nodes = [];
  const TOTAL_COUNT = 12000; 

  for (let i = 0; i < TOTAL_COUNT; i++) {
    const layer = Math.floor(Math.random() * LAYERS);
    const tInLayer = Math.random(); 

    let t = (layer * 0.25) + (tInLayer * 0.28);
    if (t > 1) t = 1; 

    const taper = Math.pow(1 - t, 0.88);
    const baseR = BASE_R * taper;
    const bulge = 1 + Math.pow(1 - tInLayer, 2) * 0.15; 

    const radius = baseR * bulge * (0.8 + Math.random() * 0.2);
    
    let angle;
    if (i % 2 === 0) {
        angle = t * TURNS * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    } else {
        angle = Math.random() * Math.PI * 2;
    }
    
    const y = TREE_H * 0.5 - t * TREE_H;
    let psize = 0.5 + Math.random() * 0.6; 

    nodes.push({
      radius, angle, y, layer, t, size: psize,
      tw: Math.random() * Math.PI * 2,
      tws: 1.5 + Math.random() * 3
    });
  }

  const connectorNodes = [];
  for (let l = 1; l < LAYERS; l++) {
    const tRatio = l * 0.25;
    const y = TREE_H * 0.5 - tRatio * TREE_H;
    const taper = Math.pow(1 - tRatio, 0.88);
    const maxR = BASE_R * taper * 1.15; 
    
    for(let i = 0; i < 1200; i++) {
        const r = maxR * (0.5 + Math.random() * 0.5);
        const angle = Math.random() * Math.PI * 2;
        const dy = (Math.random() - 0.5) * 18; 
        
        connectorNodes.push({
            radius: r, angle: angle, y: y + dy,
            size: 0.4 + Math.random() * 0.4,
            tw: Math.random() * Math.PI * 2,
            tws: 2 + Math.random() * 3
        });
    }
  }

  const heartSparks = [];
  for (let i = 0; i < 600; i++) {
      const t = Math.random() * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      const distFactor = Math.random() < 0.5 ? Math.random() : 0.85 + Math.random() * 0.15;
      
      heartSparks.push({
          x: hx * distFactor, y: hy * distFactor,
          size: 0.6 + Math.random() * 0.6,
          tw: Math.random() * Math.PI * 2, tws: 2 + Math.random() * 4
      });
  }

  const linkSparks = [];
  for(let i = 0; i < 200; i++) {
      linkSparks.push({
          x: (Math.random() - 0.5) * 20,
          y: Math.random(),
          speed: 0.5 + Math.random() * 1.5,
          size: 0.4 + Math.random() * 0.4
      });
  }

  const burstStars = [];
  for (let i = 0; i < 500; i++) { 
    const t = Math.random() * 0.9; 
    burstStars.push({
      t, angle: Math.random() * Math.PI * 2, baseY: TREE_H * 0.5 - t * TREE_H,
      phaseOffset: Math.random() * Math.PI * 2, maxExtend: 40 + Math.random() * 80, 
      size: 0.6 + Math.random() * 0.6
    });
  }

  // ==========================================
  // 【核心修改 1】：底盘星碎大幅扩建，消除边界
  // ==========================================
  const groundSparks = [];
  // 扩大数量并极限拉宽半径，铺满全屏
  for(let i=0; i<15000; i++) { 
      const angle = Math.random() * Math.PI * 2;
      // 使用指数分布让边缘也充满粒子，最大半径直接给到 1500（远超屏幕尺寸）
      const r = Math.pow(Math.random(), 0.7) * 1500; 
      groundSparks.push({
          x: Math.cos(angle) * r, 
          z: Math.sin(angle) * r, 
          y: (Math.random() - 0.5) * 40, 
          size: 0.5 + Math.random() * 0.8, // 星碎稍微变大
          tw: Math.random() * Math.PI * 2, 
          tws: 1 + Math.random() * 3,
          // 随机给每个粒子一个初始的流体相位
          flowPhase: Math.random() * Math.PI * 2 
      });
  }

  const flakes = Array.from({ length: 800 }, () => ({
    x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 2.2,
    vy: 18 + Math.random() * 55, sway: Math.random() * Math.PI * 2,
    sws: 0.6 + Math.random() * 1.4, amp: 6 + Math.random() * 22, a: 0.2 + Math.random() * 0.5 
  }));

  const fireworks = [];
  window.addEventListener('click', (e) => {
    const count = 100 + Math.random() * 80;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 10; 
      fireworks.push({
        x: e.clientX, y: e.clientY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1.0, decay: 0.015 + Math.random() * 0.02, size: 0.5 + Math.random() * 0.8
      });
    }
  });

  /* ================= 3. 辅助绘制 ================= */
  function drawIceBase(cx, cy, k, now) {
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, 0.25); 
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.8 + 0.2 * Math.sin(now / 500);
    for (let i = 1; i <= 3; i++) {
      const r = 80 * i * k + Math.sin(now / 1000 + i) * 5 * k;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.setLineDash([10 * k, 15 * k + i * 5 * k]);
      ctx.lineDashOffset = (now / (60 * i)) * (i % 2 === 0 ? 1 : -1);
      ctx.strokeStyle = `rgba(150, 230, 255, ${0.8 * pulse})`; 
      ctx.lineWidth = 2.5 * k; ctx.stroke();
    }
    ctx.restore();
  }

  /* ================= 4. 主循环 ================= */
  let prev = performance.now();
  let rot = 0;

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    rot += dt * 0.38;                      

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createRadialGradient(W/2, H*0.45, 0, W/2, H*0.45, Math.max(W, H) * 0.85);
    bg.addColorStop(0, '#102238'); 
    bg.addColorStop(0.5, '#081220'); 
    bg.addColorStop(1, '#01040a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e0f0ff'; 
    for (const f of flakes) {
      f.y += (f.vy * dt) / H; f.sway += f.sws * dt;
      if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
      ctx.globalAlpha = f.a; ctx.beginPath();
      ctx.arc((f.x + Math.sin(f.sway) * f.amp / W) * W, f.y * H, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const k = Math.min(W / 640, H / 820);  
    const cx = W / 2 + 60; 
    const cy = H * 0.5; 
    const camZ = 1150;
    const treeBaseY = cy + (TREE_H * 0.5 + 20) * k; 

    const cycleTime = 8000; const nowCycle = now % cycleTime;
    let currentSweep = (nowCycle < 4000) ? Math.floor(nowCycle / 1000) + 1 : 4;
    const layerProgress = (nowCycle < 4000) ? (nowCycle % 1000) / 1000 : 1;
    const breathScale = 1 + Math.sin(now / 500) * 0.03; 

    // --- 【核心修改 2】：将底盘和星海移到缩放外，保证绝对固定 ---
    ctx.save(); 
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx, treeBaseY); 
    ctx.scale(1, 0.28);
    // 底盘光晕
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 450 * k);
    gg.addColorStop(0, 'rgba(120, 220, 255, 0.3)'); 
    gg.addColorStop(1, 'rgba(0, 100, 200, 0)');
    ctx.fillStyle = gg; 
    ctx.beginPath(); ctx.arc(0, 0, 450 * k, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    drawIceBase(cx, treeBaseY, k, now);

    // 渲染流动的星海
    ctx.globalCompositeOperation = 'lighter';
    const flowSpeed = now / 1000;
    
    for (const p of groundSparks) {
        const sc = camZ / (camZ + p.z);
        
        // 【核心修改 3】：加入流动波纹算法
        // 通过 z 坐标加上时间，生成一道从远到近扫过的波浪
        const wave = Math.sin(p.z * 0.005 - now / 800 + p.flowPhase);
        // 通过 x 坐标生成另一道横向波浪
        const wave2 = Math.cos(p.x * 0.008 + now / 1200);
        
        const tw = 0.5 + 0.5 * Math.sin(now / 500 * p.tws + p.tw);
        // 将波纹融入透明度，产生明暗流动感
        let alpha = 0.6 * tw + 0.4 * Math.max(0, wave * wave2);
        alpha = Math.min(1, Math.max(0, alpha));

        const size = p.size * k * sc * 1.6; 
        
        // y 轴轻微上下浮动，模拟水面流光
        const floatY = p.y + Math.sin(now / 600 + p.flowPhase) * 8;

        const px = cx + p.x * k * sc;
        const py = treeBaseY + floatY * k * sc;

        ctx.globalAlpha = alpha; 
        const spr = spriteOf();
        ctx.drawImage(spr, px - size, py - size, size * 2, size * 2);
    }

    // --- 以下为树体绘制（受呼吸缩放影响） ---
    ctx.save();
    ctx.translate(cx, treeBaseY);
    ctx.scale(breathScale, breathScale);
    ctx.translate(-cx, -treeBaseY);
    ctx.globalCompositeOperation = 'lighter';

    // 树体主体
    for (const p of nodes) {
      const pLayer = p.layer + 1;
      if (pLayer > currentSweep) continue; 
      let layerFade = (pLayer === currentSweep && nowCycle < 4000) ? layerProgress : 1;

      const a = p.angle + rot;
      const z = Math.sin(a) * p.radius;
      const x = Math.cos(a) * p.radius;
      const sc = camZ / (camZ + z);
      const depth = (z / BASE_R + 1) * 0.5;  
      const tw = 0.5 + 0.5 * Math.sin(now / 1000 * p.tws + p.tw);

      ctx.globalAlpha = Math.min(1, (0.7 + 0.3 * depth) * tw * layerFade);
      const size = p.size * k * sc * 1.5; 
      ctx.drawImage(spriteOf(), cx + x * k * sc - size, cy + p.y * k * sc - size, size * 2, size * 2);
    }

    // 连接枢纽
    for (const p of connectorNodes) {
      const sweepRatio = (TREE_H * 0.5 - p.y) / TREE_H;
      if (sweepRatio > currentSweep * 0.25) continue;

      const a = p.angle + rot;
      const z = Math.sin(a) * p.radius;
      const x = Math.cos(a) * p.radius;
      const sc = camZ / (camZ + z);
      const tw = 0.5 + 0.5 * Math.sin(now / 1000 * p.tws + p.tw);
      
      ctx.globalAlpha = Math.min(1, 0.8 * tw); 
      const size = p.size * k * sc * 1.5;
      ctx.drawImage(spriteOf(), cx + x * k * sc - size, cy + p.y * k * sc - size, size * 2, size * 2);
    }

    // 层级连接处光环
    ctx.save();
    for (let l = 1; l < LAYERS; l++) {
        if (l >= currentSweep) continue; 
        
        const tRatio = l / LAYERS;
        const py = cy + (TREE_H * 0.5 - tRatio * TREE_H) * k;
        const taper = Math.pow(1 - tRatio, 0.88);
        const r = BASE_R * taper * 1.05; 
        
        const isActive = (l === currentSweep - 1 && nowCycle < 4000);
        
        if (isActive) {
            ctx.beginPath();
            ctx.ellipse(cx, py, r * k, r * k * 0.3, 0, 0, Math.PI * 2);
            let fillAlpha = 0.4 * layerProgress;
            const grad = ctx.createRadialGradient(cx, py, r * k * 0.5, cx, py, r * k);
            grad.addColorStop(0, `rgba(150, 230, 255, ${fillAlpha})`);
            grad.addColorStop(1, `rgba(100, 180, 255, 0)`);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(cx, py, r * k, r * k * 0.3, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(200, 245, 255, ${0.9 * layerProgress})`;
            ctx.lineWidth = 3 * k;
            ctx.shadowBlur = 10 * k;
            ctx.shadowColor = '#80d0ff';
            ctx.stroke();
            ctx.shadowBlur = 0; 
        } else {
            const numPoints = 80; 
            for (let p = 0; p < numPoints; p++) {
                const a = (p / numPoints) * Math.PI * 2;
                const randR = r * k * (0.95 + Math.random() * 0.1); 
                const px = cx + Math.cos(a) * randR;
                const pyOffset = py + Math.sin(a) * randR * 0.3;
                
                const tw = 0.5 + 0.5 * Math.sin(now / 1000 + p);
                ctx.globalAlpha = 0.5 * tw; 
                const size = 2.5 * k; 
                ctx.drawImage(spriteOf(), px - size, pyOffset - size, size * 2, size * 2);
            }
        }
        
        for (let p = 0; p < 20; p++) {
            const flowAngle = now / 500 + p * (Math.PI * 2 / 20);
            const px = cx + Math.cos(flowAngle) * r * k;
            const py_offset = py + Math.sin(flowAngle) * r * k * 0.3;
            
            const size = 3 * k * (0.8 + 0.2 * Math.sin(now / 200 + p));
            ctx.globalAlpha = isActive ? 1 : 0.4; 
            ctx.drawImage(spriteOf(), px - size, py_offset - size, size * 2, size * 2);
        }
    }
    ctx.restore();

    // 爆裂星
    for (const p of burstStars) {
      const pLayer = Math.floor(p.t / 0.25) + 1;
      if (pLayer > currentSweep) continue;
      let layerFade = (pLayer === currentSweep && nowCycle < 4000) ? layerProgress : 1;

      const extendDist = Math.abs(Math.sin(now / 600 + p.phaseOffset)) * p.maxExtend;
      const angle = p.angle + rot * 0.5;
      const x3d = Math.cos(angle) * extendDist;
      const z3d = Math.sin(angle) * extendDist;
      const sc = camZ / (camZ + z3d);
      
      ctx.globalAlpha = Math.max(0, (1 - extendDist / p.maxExtend) * 0.9 * layerFade); 
      const size = p.size * k * sc * (1 - extendDist / p.maxExtend * 0.5) * 1.5; 
      ctx.drawImage(spriteOf(), cx + x3d * k * sc - size, cy + p.baseY * k * sc - size, size * 2, size * 2);
    }

    // 顶部冰晶爱心
    if (currentSweep >= LAYERS) {
      const starFade = (currentSweep === LAYERS && nowCycle < 4000) ? layerProgress : 1;
      ctx.globalAlpha = Math.min(1, starFade);
      
      const heartBeat = 1 + Math.sin(now / 200) * 0.1 + Math.sin(now / 400) * 0.05;
      const topTreeY = cy - TREE_H * 0.5 * k;
      const heartCY = topTreeY - 35 * k;
      const heartR = 24 * k * heartBeat;

      const hGlow = ctx.createRadialGradient(cx, heartCY, 0, cx, heartCY, heartR * 2.5);
      hGlow.addColorStop(0, `rgba(150, 230, 255, ${0.5 * starFade})`);
      hGlow.addColorStop(1, 'rgba(50, 150, 255, 0)');
      ctx.fillStyle = hGlow;
      ctx.beginPath(); ctx.arc(cx, heartCY, heartR * 2.5, 0, Math.PI * 2); ctx.fill();

      for (const p of linkSparks) {
          let phase = (now / 1000 * p.speed + p.y) % 1;
          const lx = cx + p.x * k;
          const ly = heartCY + 15 * k + phase * 35 * k; 
          
          ctx.globalAlpha = Math.min(1, (1 - Math.abs(phase - 0.5) * 2) * starFade);
          const size = p.size * k * 1.5;
          ctx.drawImage(spriteOf(), lx - size, ly - size, size * 2, size * 2);
      }

      for (const p of heartSparks) {
          const px = cx + p.x * k * heartBeat;
          const py = heartCY + p.y * k * heartBeat;
          const tw = 0.5 + 0.5 * Math.sin(now / 300 * p.tws + p.tw);
          ctx.globalAlpha = Math.min(1, tw * starFade * 1.5); 
          const size = p.size * k * 1.8;
          ctx.drawImage(spriteOf(), px - size, py - size, size * 2, size * 2);
      }
    }

    ctx.restore(); // 结束树体缩放

    // 点击礼花
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const p = fireworks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.vx *= 0.96; p.vy *= 0.96; p.life -= p.decay;
      if (p.life <= 0) { fireworks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life * 1.0; 
      const size = p.size * p.life * 2; 
      ctx.drawImage(spriteOf(), p.x - size, p.y - size, size * 2, size * 2);
    }
    
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
  startTyping();
})();
</script>
</body>
</html>
